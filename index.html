<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CM 10-11 Bag Filter Dashboard</title>
    
    <!-- ฟอนต์ Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- ไลบรารี -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.rawgit.com/Mikhus/canvas-gauges/gh-pages/download/2.1.7/radial/gauge.min.js"></script>

    <style>
        /* =========================================
           1. ตัวแปรสีและธีม (Design Tokens)
           ========================================= */
        :root {
            /* ธีมมืด (Default) */
            --bg-page: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-color: #38bdf8;
            --status-ok: #10b981;
            --status-error: #ef4444;
            --gauge-bg: transparent;
        }

        [data-theme="light"] {
            /* ธีมสว่าง */
            --bg-page: #f1f5f9;
            --glass-bg: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent-color: #0284c7;
            --gauge-bg: transparent;
        }

        /* =========================================
           2. ตั้งค่าพื้นฐาน (Base Styles)
           ========================================= */
        * { box-sizing: border-box; transition: background-color 0.3s, border-color 0.3s, color 0.3s; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-page); 
            color: var(--text-main);
            margin: 0; 
            padding: 15px 20px;
            height: 100dvh; 
            display: flex;
            flex-direction: column;
            overflow: hidden; 
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.05) 0%, transparent 50%);
        }
        
        /* =========================================
           3. ส่วนหัว (Header)
           ========================================= */
        .header {
            display: flex; flex-direction: column; align-items: center; 
            margin-bottom: 15px; position: relative; z-index: 10;
        }
        
        .header-title-box { display: flex; align-items: center; gap: 15px; margin-bottom: 8px; }
        
        .logo-box {
            background: #fff; padding: 5px 12px; border-radius: 8px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 { margin: 0; font-size: 1.8rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--glass-bg); padding: 5px 16px; 
            border-radius: 30px; font-size: 0.85rem; font-weight: 600;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(10px);
        }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: var(--status-error); }
        .status-dot.online { background-color: var(--status-ok); box-shadow: 0 0 10px var(--status-ok); animation: pulse 2s infinite; }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .theme-btn {
            position: absolute; right: 0; top: 50%; transform: translateY(-50%);
            background: var(--glass-bg); color: var(--text-main);
            border: 1px solid var(--glass-border); border-radius: 50%;
            width: 40px; height: 40px; cursor: pointer; font-size: 1.2rem;
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(10px); box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .theme-btn:hover { transform: translateY(-50%) scale(1.1); }

        /* =========================================
           4. โครงสร้างหลัก (Layout & Cards)
           ========================================= */
        .dashboard-main {
            display: flex; flex-direction: row; flex-grow: 1; gap: 20px; min-height: 0;
        }
        
        .glass-card {
            background: var(--glass-bg); border-radius: 20px; 
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.15);
            display: flex; flex-direction: column; align-items: center;
            padding: 20px;
        }

        .card-title {
            font-size: 1rem; font-weight: 700; color: var(--accent-color); 
            text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; text-align: center;
        }

        .card-status { font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; }
        .text-ok { color: var(--status-ok); }
        .text-err { color: var(--status-error); }

        .main-panel { flex: 0 0 320px; justify-content: center; cursor: pointer; }
        .main-panel:hover { border-color: var(--accent-color); transform: translateY(-2px); }

        .gates-panel {
            flex-grow: 1; display: grid; 
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(2, 1fr); 
            gap: 15px; background: transparent; padding: 0; border: none; box-shadow: none; backdrop-filter: none;
        }

        .gate-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 10px; cursor: pointer; backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .gate-card:hover { transform: scale(1.03); border-color: var(--accent-color); }

        /* =========================================
           5. เอฟเฟกต์แจ้งเตือน (Visual Alerts)
           ========================================= */
        .gate-card.alert {
            animation: borderGlow 1.5s ease-in-out infinite;
        }
        @keyframes borderGlow {
            0% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 5px rgba(239, 68, 68, 0.2); }
            50% { border-color: var(--status-error); box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
            100% { border-color: rgba(239, 68, 68, 0.5); box-shadow: 0 0 5px rgba(239, 68, 68, 0.2); }
        }

        /* =========================================
           6. Modal สำหรับแสดงกราฟ (Popup)
           ========================================= */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(5px);
            z-index: 1000; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.show { display: flex; opacity: 1; }
        
        .modal-content {
            background: var(--bg-page); width: 90%; max-width: 1000px; height: 70vh;
            border-radius: 20px; padding: 25px; border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex; flex-direction: column; position: relative;
            transform: scale(0.95); transition: transform 0.3s ease;
        }
        .modal.show .modal-content { transform: scale(1); }
        
        .close-btn {
            position: absolute; top: 20px; right: 25px; font-size: 1.8rem; color: var(--text-sub);
            cursor: pointer; background: none; border: none; padding: 0; line-height: 1;
        }
        .close-btn:hover { color: var(--status-error); }
        
        .chart-wrapper { position: relative; flex-grow: 1; width: 100%; min-height: 0; margin-top: 15px; }

        @media (max-width: 1024px) {
            .dashboard-main { flex-direction: column; overflow-y: auto; padding-right: 5px; }
            .main-panel { flex: none; padding: 15px; }
            .gates-panel { grid-template-columns: repeat(2, 1fr); grid-template-rows: auto; height: auto; }
            .theme-btn { top: 10px; transform: none; }
        }
    </style>
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="header-title-box">
            <div class="logo-box">
                <!-- เปลี่ยนไปเรียกใช้ไฟล์จากเครื่อง (Local File) เพื่อแก้ปัญหาโดนบล็อก -->
                <img src="scg-logo.png" alt="SCG" style="height: 30px;">
            </div>
            <h1>CM 10-11 Bag Filter Purge</h1>
        </div>
        
        <div class="status-badge">
            <div class="status-dot" id="mqtt-dot"></div>
            <span id="mqtt-text">Connecting...</span>
        </div>
        
        <button class="theme-btn" onclick="toggleTheme()" title="Switch Theme">☀️</button>
    </header>

    <!-- Main Dashboard Area -->
    <main class="dashboard-main">
        
        <!-- Left: Main Header Pressure -->
        <div class="glass-card main-panel" onclick="openChartModal('av', 'Main Header (AV)', '#38bdf8')">
            <div class="card-title">Main Header</div>
            <div class="card-status text-ok" id="status-av">System Normal</div>
            <canvas id="gauge-av"></canvas>
        </div>

        <!-- Right: 8 Gates Grid -->
        <div class="gates-panel" id="gates-container">
            <!-- สร้างผ่าน JS -->
        </div>

    </main>

    <!-- Modal Chart (ซ่อนไว้ เริ่มต้น) -->
    <div class="modal" id="chartModal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal(event)">&times;</button>
            <div class="card-title" id="modalTitle">Loading History...</div>
            <div class="chart-wrapper">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <!-- =========================================
         JavaScript Logic
         ========================================= -->
    <script>
        // --- 1. จัดการ Dark / Light Mode ---
        let currentTheme = 'dark';
        
        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.querySelector('.theme-btn').innerText = currentTheme === 'dark' ? '☀️' : '🌙';
            
            const isLight = currentTheme === 'light';
            const titleColor = isLight ? '#0f172a' : '#f8fafc';
            const numColor = isLight ? '#64748b' : '#94a3b8';
            const tickColor = isLight ? '#94a3b8' : '#64748b';

            document.gauges.forEach(gauge => {
                gauge.update({
                    colorTitle: titleColor,
                    colorNumbers: numColor,
                    colorMajorTicks: tickColor,
                    colorMinorTicks: tickColor,
                    colorValueText: titleColor
                });
            });

            if (chartInstance) {
                const gridColor = isLight ? '#e2e8f0' : 'rgba(255,255,255,0.05)';
                chartInstance.options.scales.x.grid.color = gridColor;
                chartInstance.options.scales.y.grid.color = gridColor;
                chartInstance.update();
            }
        }

        // --- 2. ฟังก์ชันสร้าง Gauge อัตโนมัติ ---
        const gatesConfig = [
            { id: 'p1', name: '6526.04', color: '#38bdf8' },
            { id: 'p2', name: '6524.041', color: '#38bdf8' },
            { id: 'p3', name: '6526.08', color: '#38bdf8' },
            { id: 'p4', name: '6536.04', color: '#38bdf8' },
            { id: 'p5', name: '6536.041', color: '#38bdf8' },
            { id: 'p6', name: '6536.08', color: '#38bdf8' },
            { id: 'p7', name: '6511.76', color: '#38bdf8' },
            { id: 'p8', name: '6511.80', color: '#38bdf8' }
        ];

        const container = document.getElementById('gates-container');
        
        gatesConfig.forEach((gate) => {
            const html = `
                <div class="gate-card" id="card-${gate.id}" onclick="openChartModal('${gate.id}', 'Gate ${gate.name}', '${gate.color}')">
                    <div class="card-title">${gate.name}</div>
                    <div class="card-status text-ok" id="status-${gate.id}">Wait...</div>
                    <canvas id="gauge-${gate.id}"></canvas>
                </div>
            `;
            container.innerHTML += html;
        });

        // ฟังก์ชันตั้งค่าหน้าปัดเกจ (ปรับสีแถบ Highlights ให้เข้มทึบ 100%)
        function initGauge(elementId, size) {
            let el = document.getElementById(elementId);
            el.setAttribute('data-type', 'radial-gauge');
            el.setAttribute('data-width', size); 
            el.setAttribute('data-height', size);
            el.setAttribute('data-min-value', '0');
            el.setAttribute('data-max-value', '10');
            el.setAttribute('data-major-ticks', '0,2,4,6,8,10');
            el.setAttribute('data-minor-ticks', '2');
            el.setAttribute('data-stroke-ticks', 'true');
            // ปรับสีทึบ: แดง (#ef4444) และ เขียว (#10b981)
            el.setAttribute('data-highlights', '[ {"from": 0, "to": 4, "color": "#ef4444"}, {"from": 4, "to": 10, "color": "#10b981"} ]');
            el.setAttribute('data-color-plate', 'transparent');
            el.setAttribute('data-color-major-ticks', '#64748b');
            el.setAttribute('data-color-minor-ticks', '#64748b');
            el.setAttribute('data-color-title', '#f8fafc');
            el.setAttribute('data-color-numbers', '#94a3b8');
            el.setAttribute('data-value-box', 'true');
            el.setAttribute('data-color-value-box-rect', 'transparent');
            el.setAttribute('data-color-value-text', '#f8fafc');
            el.setAttribute('data-animation-rule', 'bounce'); 
            el.setAttribute('data-animation-duration', '500');
        }

        // โหลดตั้งค่าเกจทั้งหมด
        initGauge('gauge-av', '240');
        gatesConfig.forEach(gate => initGauge(`gauge-${gate.id}`, '135'));

        // --- 3. MQTT Connection & Data Update ---
        const broker = "4d79d42984154e37aab32ca068370f40.s1.eu.hivemq.cloud";
        const port = 8884; 
        const topic = "factory/bagfilter/pressures";
        const clientId = "WebClient-UI-" + Math.random().toString(16).substr(2, 8);
        const mqtt_user = "esp32_bagfilter_sensor";
        const mqtt_password = "Mcl195088";

        const client = new Paho.MQTT.Client(broker, port, clientId);
        const mqttDot = document.getElementById("mqtt-dot");
        const mqttText = document.getElementById("mqtt-text");

        client.onConnectionLost = function(res) {
            mqttDot.classList.remove("online");
            mqttText.innerText = "Offline - Reconnecting";
            setTimeout(connectMQTT, 5000);
        };

        client.onMessageArrived = function(message) {
            try {
                const data = JSON.parse(message.payloadString);
                
                document.getElementById('gauge-av').setAttribute('data-value', data.av.toFixed(2));
                const avStatus = document.getElementById('status-av');
                if (data.av < 4) {
                    avStatus.innerText = "Low Pressure";
                    avStatus.className = "card-status text-err";
                } else {
                    avStatus.innerText = "System Normal";
                    avStatus.className = "card-status text-ok";
                }
                
                const updateGateUI = (id, val) => {
                    document.getElementById(`gauge-${id}`).setAttribute('data-value', val);
                    const card = document.getElementById(`card-${id}`);
                    const statusText = document.getElementById(`status-${id}`);
                    
                    if (val < 4) {
                        card.classList.add('alert');
                        statusText.innerText = "Low Pressure";
                        statusText.className = "card-status text-err";
                    } else {
                        card.classList.remove('alert');
                        statusText.innerText = "Normal";
                        statusText.className = "card-status text-ok";
                    }
                };

                gatesConfig.forEach((gate, idx) => {
                    updateGateUI(gate.id, data[`p${idx+1}`]);
                });
                
            } catch(e) { console.error("JSON Error:", e); }
        };

        function connectMQTT() {
            client.connect({
                userName: mqtt_user, password: mqtt_password, useSSL: true,
                onSuccess: function() {
                    mqttDot.classList.add("online");
                    mqttText.innerText = "Live Connected";
                    client.subscribe(topic);
                },
                onFailure: function() { setTimeout(connectMQTT, 5000); }
            });
        }
        connectMQTT();

        // --- 4. กราฟ 48 ชั่วโมง (ดึงข้อมูลเตรียมไว้ก่อน) ---
        let globalHistory = [];
        const sheetURL = "https://script.google.com/macros/s/AKfycbwkMTHj9lhFm79HaQTtLE4tC77O1ILsmazRb6s5tPdamXZct9hlC7sEwc9Xb3l4XydN/exec";

        async function fetchHistory() {
            try {
                const res = await fetch(sheetURL);
                globalHistory = await res.json();
            } catch (err) { console.error('Fetch Error:', err); }
        }
        fetchHistory(); 

        // --- 5. จัดการแสดงผลกราฟใน Modal (Popup) ---
        Chart.defaults.font.family = "'Inter', sans-serif";
        let chartInstance = null;

        function openChartModal(dataKey, title, colorCode) {
            const modal = document.getElementById('chartModal');
            const titleEl = document.getElementById('modalTitle');
            
            modal.classList.add('show');
            
            if (globalHistory.length === 0) {
                titleEl.innerText = "Loading data from database... Please wait.";
                return;
            }
            
            titleEl.innerText = `${title} - 48 Hours Trend`;
            
            const labels = globalHistory.map(r => r.time);
            const dataset = globalHistory.map(r => r[dataKey]);
            const ctx = document.getElementById('historyChart').getContext('2d');
            
            if (chartInstance) chartInstance.destroy();

            const isLight = currentTheme === 'light';
            const gridColor = isLight ? '#e2e8f0' : 'rgba(255,255,255,0.05)';

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Pressure (Bar)',
                        data: dataset,
                        borderColor: colorCode,
                        backgroundColor: colorCode + '20', 
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 0, 
                        pointHoverRadius: 6,
                        tension: 0.4 
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { display: false } },
                        y: { 
                            min: 0, max: 10,
                            grid: { color: gridColor },
                            title: { display: true, text: 'Pressure (Bar)' }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        function closeModal(e) {
            if(e) e.stopPropagation();
            document.getElementById('chartModal').classList.remove('show');
        }
    </script>
</body>
</html>

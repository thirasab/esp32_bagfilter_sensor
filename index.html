<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Bag Filter Dashboard</title>
    
    <!-- นำเข้าฟอนต์ Inter จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- ไลบรารีที่จำเป็น -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.rawgit.com/Mikhus/canvas-gauges/gh-pages/download/2.1.7/radial/gauge.min.js"></script>

    <style>
        /* --- Color Palette & Variables --- */
        :root {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --status-ok: #10b981;
            --status-error: #ef4444;
        }

        /* --- Base Styles --- */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            margin: 0; padding: 20px;
        }
        
        /* --- Header & Status --- */
        .header-container {
            display: flex; flex-direction: column; align-items: center; margin-bottom: 20px;
        }
        h1 { margin: 0 0 10px 0; font-size: 2rem; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; text-align: center; }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(30, 41, 59, 0.8); padding: 6px 16px; 
            border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            border: 1px solid #334155;
        }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background-color: var(--status-error);
        }
        .status-dot.online {
            background-color: var(--status-ok);
            box-shadow: 0 0 10px var(--status-ok);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- Mobile Tabs (แสดงเฉพาะในจอมือถือ) --- */
        .mobile-tabs {
            display: flex;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 6px;
            margin: 0 auto 20px auto;
            max-width: 600px;
            gap: 6px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: var(--accent-blue);
            color: var(--bg-body);
        }

        /* --- Layout Grid & Cards --- */
        .dashboard-grid {
            display: grid; gap: 20px;
            max-width: 1400px; margin: 0 auto;
        }
        
        .card {
            background: var(--bg-card); border-radius: 16px; padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            /* ซ่อน Card ทั้งหมดไว้ก่อนในจอมือถือ */
            display: none; 
        }
        /* แสดงเฉพาะ Card ที่มีคลาส active */
        .card.active {
            display: block;
        }

        .card-header {
            font-size: 1.1rem; font-weight: 600; color: var(--text-muted);
            margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px; text-transform: uppercase; letter-spacing: 1px;
        }

        .gauge-container { display: flex; justify-content: center; }
        .chart-container { position: relative; height: 300px; width: 100%; }
        .history-container { position: relative; height: 400px; width: 100%; }

        /* --- Responsive Breakpoints (จอคอม) --- */
        @media (min-width: 1024px) {
            .mobile-tabs {
                display: none; /* ซ่อน Tab ทิ้งไปเลยเมื่อเป็นหน้าจอใหญ่ */
            }
            .card {
                display: block !important; /* บังคับแสดง Card ทั้งหมดโดยไม่ต้องสนคลาส active */
            }
            .dashboard-grid {
                grid-template-columns: 350px 1fr; /* แบ่ง 2 คอลัมน์ (เกจจ์ซ้าย บาร์ขวา) */
            }
            .full-width { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Bag Filter Purge Monitor</h1>
        <div class="status-badge" id="mqtt-badge">
            <div class="status-dot" id="mqtt-dot"></div>
            <span id="mqtt-text">Connecting...</span>
        </div>
    </div>

    <!-- ส่วนของ Mobile Tabs -->
    <div class="mobile-tabs">
        <button class="tab-btn active" onclick="switchTab('card-gauge')">Gauge</button>
        <button class="tab-btn" onclick="switchTab('card-live')">Live Node</button>
        <button class="tab-btn" onclick="switchTab('card-history')">48H Trend</button>
    </div>

    <div class="dashboard-grid">
        <!-- Card 1: Gauge (Live AV) - ใส่ id และคลาส active เริ่มต้น -->
        <div class="card active" id="card-gauge">
            <div class="card-header">Main Header Pressure</div>
            <div class="gauge-container">
                <canvas id="av-gauge" data-type="radial-gauge"
                    data-width="260" data-height="260"
                    data-units="Bar" data-title="AV"
                    data-min-value="0" data-max-value="10"
                    data-major-ticks="0,2,4,6,8,10"
                    data-minor-ticks="2"
                    data-stroke-ticks="true"
                    data-highlights='[ {"from": 0, "to": 3, "color": "rgba(239, 68, 68, .3)"}, {"from": 3, "to": 7, "color": "rgba(16, 185, 129, .2)"}, {"from": 7, "to": 10, "color": "rgba(245, 158, 11, .3)"} ]'
                    data-color-plate="transparent"
                    data-color-major-ticks="#94a3b8" data-color-minor-ticks="#94a3b8"
                    data-color-title="#fff" data-color-units="#94a3b8" data-color-numbers="#e2e8f0"
                    data-value-box="true" data-color-value-box-rect="#0f172a" data-color-value-text="#fff"
                    data-animation-rule="linear" data-animation-duration="300">
                </canvas>
            </div>
        </div>

        <!-- Card 2: Live Bar Chart (P1-P8) - ใส่ id -->
        <div class="card" id="card-live">
            <div class="card-header">Live Node Status</div>
            <div class="chart-container">
                <canvas id="liveBarChart"></canvas>
            </div>
        </div>

        <!-- Card 3: History Line Chart (48 Hours) - ใส่ id -->
        <div class="card full-width" id="card-history">
            <div class="card-header">48-Hour Trend (Sync: 30 Mins)</div>
            <div class="history-container">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ฟังก์ชันสำหรับจัดการ Mobile Tabs
        // ==========================================
        function switchTab(targetCardId) {
            // ถอดคลาส active จากปุ่ม Tab และ Card ทั้งหมด
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));

            // เติมคลาส active ให้ปุ่มที่ถูกกด และ Card ที่ตรงกัน
            event.currentTarget.classList.add('active');
            document.getElementById(targetCardId).classList.add('active');

            // ทริคสำคัญ: บังคับให้ Chart.js อัปเดตขนาดตัวเองใหม่ (กันกราฟพังตอนแสดงผลจาก display:none)
            setTimeout(() => {
                window.dispatchEvent(new Event('resize'));
            }, 50);
        }

        // ==========================================
        // การตั้งค่าทั่วไป
        // ==========================================
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#94a3b8';

        const liveCtx = document.getElementById('liveBarChart').getContext('2d');
        const liveBarChart = new Chart(liveCtx, {
            type: 'bar',
            data: {
                labels: ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'],
                datasets: [{
                    data: [0, 0, 0, 0, 0, 0, 0, 0],
                    backgroundColor: '#38bdf8', 
                    borderRadius: 6, 
                    borderSkipped: false,
                    barPercentage: 0.6
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                animation: { duration: 250 },
                scales: {
                    x: { grid: { display: false, drawBorder: false } }, 
                    y: { 
                        beginAtZero: true, max: 10,
                        grid: { color: 'rgba(255, 255, 255, 0.05)', borderDash: [5, 5] },
                        title: { display: true, text: 'Bar', color: '#64748b' }
                    }
                },
                plugins: { legend: { display: false }, tooltip: { mode: 'index', intersect: false } }
            }
        });

        // ==========================================
        // การเชื่อมต่อ MQTT (Real-time)
        // ==========================================
        const broker = "4d79d42984154e37aab32ca068370f40.s1.eu.hivemq.cloud";
        const port = 8884; 
        const topic = "factory/bagfilter/pressures";
        const clientId = "WebClient-" + Math.random().toString(16).substr(2, 8);
        const mqtt_user = "esp32_bagfilter_sensor";
        const mqtt_password = "Mcl195088";

        const client = new Paho.MQTT.Client(broker, port, clientId);
        const mqttDot = document.getElementById("mqtt-dot");
        const mqttText = document.getElementById("mqtt-text");

        client.onConnectionLost = function(responseObject) {
            mqttDot.classList.remove("online");
            mqttText.innerText = "Disconnected";
            setTimeout(connectMQTT, 5000);
        };

        client.onMessageArrived = function(message) {
            try {
                const data = JSON.parse(message.payloadString);
                
                document.getElementById('av-gauge').setAttribute('data-value', data.av.toFixed(2));
                
                liveBarChart.data.datasets[0].data = [data.p1, data.p2, data.p3, data.p4, data.p5, data.p6, data.p7, data.p8];
                liveBarChart.data.datasets[0].backgroundColor = liveBarChart.data.datasets[0].data.map(val => val < 4 ? '#ef4444' : '#38bdf8');
                liveBarChart.update();
            } catch(e) {
                console.log("JSON Parse Error: ", e);
            }
        };

        function connectMQTT() {
            client.connect({
                userName: mqtt_user, password: mqtt_password, useSSL: true,
                onSuccess: function() {
                    mqttDot.classList.add("online");
                    mqttText.innerText = "Live Connected";
                    client.subscribe(topic);
                },
                onFailure: function(message) {
                    console.log("MQTT Connection failed: " + message.errorMessage);
                    setTimeout(connectMQTT, 5000);
                }
            });
        }
        connectMQTT();

        // ==========================================
        // การดึงข้อมูล Google Sheet (Historical 48H)
        // ==========================================
        const gasURL = "https://script.google.com/macros/s/AKfycbwkMTHj9lhFm79HaQTtLE4tC77O1ILsmazRb6s5tPdamXZct9hlC7sEwc9Xb3l4XydN/exec";

        async function fetchHistoricalData() {
            try {
                const response = await fetch(gasURL);
                const data = await response.json();
                
                const labels = data.map(row => row.time);
                const colors = ['#f87171', '#fb923c', '#fbbf24', '#34d399', '#2dd4bf', '#38bdf8', '#818cf8', '#e879f9'];
                
                const datasets = [];
                for(let i=1; i<=8; i++) {
                    datasets.push({
                        label: `P${i}`,
                        data: data.map(row => row[`p${i}`]),
                        borderColor: colors[i-1],
                        borderWidth: 2,
                        pointRadius: 0,
                        pointHoverRadius: 5,
                        tension: 0.4
                    });
                }

                const ctx = document.getElementById('historyChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { grid: { display: false } },
                            y: { 
                                min: 0, max: 10,
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                title: { display: true, text: 'Pressure (Bar)' }
                            }
                        },
                        plugins: { 
                            legend: { position: 'top', labels: { usePointStyle: true, boxWidth: 8 } } 
                        }
                    }
                });
            } catch (error) { 
                console.error('Error fetching Google Sheets data:', error); 
            }
        }
        
        fetchHistoricalData(); 
    </script>
</body>
</html>

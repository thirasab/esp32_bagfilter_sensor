<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Modern Bag Filter Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.rawgit.com/Mikhus/canvas-gauges/gh-pages/download/2.1.7/radial/gauge.min.js"></script>

    <style>
        /* --- Color Palette --- */
        :root {
            --bg-body: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc;
            --text-muted: #94a3b8; --status-ok: #10b981; --status-error: #ef4444;
        }

        /* --- Base: บังคับหน้าเดียว ห้าม Scroll --- */
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-body); color: var(--text-main);
            margin: 0; padding: 8px;
            height: 100dvh; 
            width: 100vw;
            overflow: hidden; 
            display: flex; flex-direction: column;
        }
        
        /* --- Header --- */
        .header-container {
            flex: 0 0 auto; 
            display: flex; justify-content: space-between; align-items: center; 
            margin-bottom: 8px; padding: 0 5px;
        }
        h1 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .status-badge {
            display: inline-flex; align-items: center; gap: 6px;
            background: rgba(30, 41, 59, 0.8); padding: 4px 10px; 
            border-radius: 20px; font-size: 0.75rem; font-weight: 600;
        }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: var(--status-error); }
        .status-dot.online {
            background-color: var(--status-ok);
            box-shadow: 0 0 8px var(--status-ok);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 5px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* --- Layout Grid สำหรับมือถือ --- */
        .dashboard-grid {
            flex: 1 1 0; 
            display: grid; 
            grid-template-columns: 1fr 1.2fr; 
            grid-template-rows: 35% 65%;      
            gap: 8px;
            min-height: 0; 
        }
        .card {
            background: var(--bg-card); border-radius: 12px; padding: 8px;
            display: flex; flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .full-width { grid-column: 1 / -1; } 
        
        .card-header {
            font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
            margin-bottom: 5px; text-transform: uppercase; white-space: nowrap;
            flex: 0 0 auto;
        }

        /* --- Containers --- */
        .gauge-container { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; }
        
        .gauge-container canvas {
            width: 100% !important; height: 100% !important;
            max-width: 180px; max-height: 180px;
            object-fit: contain;
        }
        
        .chart-container, .history-container {
            flex: 1; position: relative; min-height: 0; width: 100%;
        }

        /* --- สำหรับจอคอมพิวเตอร์ --- */
        @media (min-width: 768px) {
            body { padding: 20px; }
            .header-container { flex-direction: column; gap: 10px; margin-bottom: 20px; }
            h1 { font-size: 2rem; }
            .dashboard-grid {
                grid-template-columns: 300px 1fr;
                grid-template-rows: 300px 1fr;
                gap: 20px; max-width: 1400px; margin: 0 auto;
            }
            .card { padding: 20px; }
            .card-header { font-size: 1rem; margin-bottom: 15px; }
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Bag Filter Monitor</h1>
        <div class="status-badge" id="mqtt-badge">
            <div class="status-dot" id="mqtt-dot"></div>
            <span id="mqtt-text">Connecting...</span>
        </div>
    </div>

    <div class="dashboard-grid">
        <!-- Card 1: Gauge -->
        <div class="card">
            <div class="card-header">Main (Bar)</div>
            <div class="gauge-container">
                <canvas id="av-gauge" data-type="radial-gauge"
                    data-width="200" data-height="200"
                    data-units="Bar" data-title="AV"
                    data-min-value="0" data-max-value="10"
                    data-major-ticks="0,2,4,6,8,10"
                    data-minor-ticks="2" data-stroke-ticks="true"
                    data-highlights='[ {"from": 0, "to": 3, "color": "rgba(239, 68, 68, .3)"}, {"from": 3, "to": 7, "color": "rgba(16, 185, 129, .2)"}, {"from": 7, "to": 10, "color": "rgba(245, 158, 11, .3)"} ]'
                    data-color-plate="transparent"
                    data-color-major-ticks="#94a3b8" data-color-minor-ticks="#94a3b8"
                    data-color-title="#fff" data-color-units="#94a3b8" data-color-numbers="#e2e8f0"
                    data-value-box="true" data-color-value-box-rect="#0f172a" data-color-value-text="#fff"
                    data-animation-rule="linear" data-animation-duration="300">
                </canvas>
            </div>
        </div>

        <!-- Card 2: Live Bar Chart -->
        <div class="card">
            <div class="card-header">Live Node</div>
            <div class="chart-container">
                <canvas id="liveBarChart"></canvas>
            </div>
        </div>

        <!-- Card 3: History Line Chart -->
        <div class="card full-width">
            <div class="card-header">48-H Trend (30M Sync)</div>
            <div class="history-container">
                <canvas id="historyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        Chart.defaults.font.family = "'Inter', sans-serif";
        Chart.defaults.color = '#94a3b8';
        Chart.defaults.font.size = 9; 

        // ==========================================
        // 1. ตั้งค่ากราฟแท่ง (Live Bar Chart)
        // ==========================================
        const liveCtx = document.getElementById('liveBarChart').getContext('2d');
        const liveBarChart = new Chart(liveCtx, {
            type: 'bar',
            data: {
                labels: ['P1', 'P2', 'P3', 'P4', 'P5', 'P6', 'P7', 'P8'],
                datasets: [{
                    data: [0, 0, 0, 0, 0, 0, 0, 0],
                    backgroundColor: '#38bdf8', borderRadius: 4, barPercentage: 0.8
                }]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                animation: { duration: 250 },
                layout: { padding: { right: 10 } }, // ป้องกัน P8 ตกขอบจอ
                scales: {
                    x: { 
                        grid: { display: false, drawBorder: false }, 
                        ticks: { 
                            font: { size: 8 },
                            autoSkip: false, // บังคับให้แสดง Label P1-P8 ครบทุกตัว
                            maxRotation: 0   // ตัวหนังสือแนวนอน
                        } 
                    }, 
                    y: { 
                        beginAtZero: true, max: 10,
                        grid: { color: 'rgba(255, 255, 255, 0.05)', borderDash: [2, 4] },
                        ticks: { stepSize: 2 } 
                    }
                },
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });

        // ==========================================
        // 2. ส่วนของการเชื่อมต่อ MQTT
        // ==========================================
        const broker = "4d79d42984154e37aab32ca068370f40.s1.eu.hivemq.cloud";
        const port = 8884; 
        const topic = "factory/bagfilter/pressures";
        const clientId = "Web-" + Math.random().toString(16).substr(2, 6);
        const mqtt_user = "esp32_bagfilter_sensor";
        const mqtt_password = "Mcl195088";

        const client = new Paho.MQTT.Client(broker, port, clientId);
        const mqttDot = document.getElementById("mqtt-dot");
        const mqttText = document.getElementById("mqtt-text");

        client.onConnectionLost = function() {
            mqttDot.classList.remove("online");
            mqttText.innerText = "Offline";
            setTimeout(connectMQTT, 5000);
        };

        client.onMessageArrived = function(message) {
            try {
                const data = JSON.parse(message.payloadString);
                document.getElementById('av-gauge').setAttribute('data-value', data.av.toFixed(2));
                liveBarChart.data.datasets[0].data = [data.p1, data.p2, data.p3, data.p4, data.p5, data.p6, data.p7, data.p8];
                liveBarChart.data.datasets[0].backgroundColor = liveBarChart.data.datasets[0].data.map(val => val < 4 ? '#ef4444' : '#38bdf8');
                liveBarChart.update();
            } catch(e) {}
        };

        function connectMQTT() {
            client.connect({
                userName: mqtt_user, password: mqtt_password, useSSL: true,
                onSuccess: function() {
                    mqttDot.classList.add("online");
                    mqttText.innerText = "Live";
                    client.subscribe(topic);
                },
                onFailure: function() { setTimeout(connectMQTT, 5000); }
            });
        }
        connectMQTT();

        // ==========================================
        // 3. ส่วนของการดึงข้อมูล Google Sheet
        // ==========================================
        const gasURL = "https://script.google.com/macros/s/AKfycbwkMTHj9lhFm79HaQTtLE4tC77O1ILsmazRb6s5tPdamXZct9hlC7sEwc9Xb3l4XydN/exec";

        async function fetchHistoricalData() {
            try {
                const response = await fetch(gasURL);
                const data = await response.json();
                
                const labels = data.map(row => row.time);
                const colors = ['#f87171', '#fb923c', '#fbbf24', '#34d399', '#2dd4bf', '#38bdf8', '#818cf8', '#e879f9'];
                
                const datasets = [];
                for(let i=1; i<=8; i++) {
                    datasets.push({
                        label: `P${i}`, data: data.map(row => row[`p${i}`]),
                        borderColor: colors[i-1], borderWidth: 1.5,
                        pointRadius: 0, pointHoverRadius: 4, tension: 0.3
                    });
                }

                const ctx = document.getElementById('historyChart').getContext('2d');
                new Chart(ctx, {
                    type: 'line',
                    data: { labels: labels, datasets: datasets },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            x: { grid: { display: false } },
                            y: { 
                                min: 0, max: 10,
                                grid: { color: 'rgba(255, 255, 255, 0.05)' },
                                ticks: { stepSize: 2 }
                            }
                        },
                        plugins: { 
                            legend: { 
                                position: 'top', 
                                labels: { usePointStyle: true, boxWidth: 6, padding: 8 } 
                            } 
                        }
                    }
                });
            } catch (error) { console.log('Error:', error); }
        }
        
        fetchHistoricalData(); 
    </script>
</body>
</html>
